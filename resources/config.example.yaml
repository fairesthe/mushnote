# server configuration --------------------
server:
  port: 3000
  host: localhost

vault:
  path: vault

history:
  path: history

# gemini agent --------------------
gemini:
  api_key: "key-here"
  ai-username: ai

# bright data (optional agent web tools)
# serp uses google full json and ai overview in code
brightdata:
  api_key: "your-bright-data-api-key"
  serp_zone: "your_serp_zone"
  webview_zone: "your_webview_zone"
  country: us

location:
  city: "Detroit, MI"
  units: imperial

# optional: allow POST /api/v1/auth/register without admin (share secret with trusted apps only)
integrations:
  registration_secret: "change-me-before-use"

users:
  - username: admin
    admin: true
    bot: false
    avatar: /avatars/default_admin.png
  - username: ai
    admin: false
    bot: true
    avatar: /avatars/default_ai.png
